<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="rwib-title rwib-desc">
  <title id="rwib-title">Recovering when it breaks: a loop you can re-enter</title>
  <desc id="rwib-desc">A circular, six-stop recovery path: stay calm and read the error, reproduce it, find the change with git bisect, undo or restore safely, fix one failure at a time, and ask for help well. An arrow closes the loop from "ask for help" back to "stay calm, read the error", showing that if it is still broken you go around again.</desc>
  <defs>
    <linearGradient id="rwib-topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9480f"/>
      <stop offset="1" stop-color="#1971c2"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1560" height="860" rx="26" fill="#fffdf8" stroke="#e4ddd0" stroke-width="2"/>
  <rect x="20" y="20" width="1560" height="10" rx="5" fill="url(#rwib-topbar)"/>

  <text x="800" y="90" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#1b2230">Recovering when it breaks</text>
  <text x="800" y="124" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#5d6676">A loop you can re-enter: six checkable stops, then around again if needed</text>

  <!-- the five forward edges, stop 1 through stop 6; left open (not closed back to
       stop 1) so the dashed arc below is the only "loop back" cue. The first
       segment (stop 1 -> stop 2) bows right early via a curve, instead of a
       straight chord, so it clears stop 1's own label (centered directly below
       stop 1) instead of cutting through it. -->
  <path d="M 800,240 Q 1050,245 1008,360 L 1008,600 L 800,720 L 592,600 L 592,360"
        fill="none" stroke="#1971c2" stroke-width="7" stroke-linejoin="round"/>

  <!-- loop-back cue: a separate dashed arc from the top of stop 6 to the top of
       stop 1, routed entirely ABOVE both nodes' label bands (it only ever comes
       close to label height while still to the left of every label's left edge),
       so it never crosses a label or the solid path above. -->
  <path d="M 592,314 C 540,150 650,120 800,194" fill="none" stroke="#1971c2" stroke-width="3.5" stroke-dasharray="2 8" stroke-linecap="round"/>
  <polygon points="800,196 780,194 789,178" fill="#1971c2"/>
  <text x="818" y="158" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-style="italic" fill="#1971c2">still broken? go again</text>

  <!-- Stop 1: Stay calm, read the error (top) -->
  <g>
    <circle cx="800" cy="240" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="800" y="254" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">1</text>
    <text x="800" y="314" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#1b2230">Stay calm, read the error</text>
    <text x="800" y="342" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="17" fill="#5d6676">find the real error line</text>
  </g>

  <!-- Stop 2: Reproduce it (upper right) -->
  <g>
    <circle cx="1008" cy="360" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="1008" y="374" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">2</text>
    <text x="1078" y="354" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#1b2230">Reproduce it</text>
    <text x="1078" y="380" text-anchor="start" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="17" fill="#5d6676">steps + expected vs. observed</text>
  </g>

  <!-- Stop 3: Find the change (lower right) -->
  <g>
    <circle cx="1008" cy="600" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="1008" y="614" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">3</text>
    <text x="1078" y="594" text-anchor="start" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#1b2230">Find the change</text>
    <text x="1078" y="620" text-anchor="start" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="17" fill="#5d6676">git bisect good / bad</text>
  </g>

  <!-- Stop 4: Undo or restore safely (bottom) -->
  <g>
    <circle cx="800" cy="720" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="800" y="734" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">4</text>
    <text x="800" y="794" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#1b2230">Undo or restore safely</text>
    <text x="800" y="822" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="17" fill="#5d6676">git revert, or reflog if lost</text>
  </g>

  <!-- Stop 5: Fix one at a time (lower left) -->
  <g>
    <circle cx="592" cy="600" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="592" y="614" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">5</text>
    <text x="522" y="594" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#1b2230">Fix one at a time</text>
    <text x="522" y="620" text-anchor="end" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="17" fill="#5d6676">one fix, one re-run</text>
  </g>

  <!-- Stop 6: Ask for help well (upper left) -->
  <g>
    <circle cx="592" cy="360" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="592" y="374" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">6</text>
    <text x="522" y="354" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#1b2230">Ask for help well</text>
    <text x="522" y="380" text-anchor="end" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="17" fill="#5d6676">redact secrets, then share</text>
  </g>

  <text x="800" y="866" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-style="italic" fill="#5d6676">Every stop produces a concrete signal: an error line, a commit, an exit code, a test result.</text>
</svg>
