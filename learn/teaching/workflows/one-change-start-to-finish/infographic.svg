<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="ocstf-title ocstf-desc">
  <title id="ocstf-title">One change, start to finish: a ten-step workflow</title>
  <desc id="ocstf-desc">A numbered winding path of ten steps: branch, check status, prompt the agent, review the diff, watch for traps, run the tests, commit, push, open a pull request, and clean up after merge. The path runs left to right across the top row, drops down on the right, then continues right to left across the bottom row.</desc>
  <defs>
    <linearGradient id="ocstf-topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9480f"/>
      <stop offset="1" stop-color="#1971c2"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1760" height="860" rx="26" fill="#fffdf8" stroke="#e4ddd0" stroke-width="2"/>
  <rect x="20" y="20" width="1760" height="10" rx="5" fill="url(#ocstf-topbar)"/>

  <text x="900" y="92" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#1b2230">One change, start to finish</text>
  <text x="900" y="128" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#5d6676">Ten small, checkable steps from branch to merged</text>

  <!-- connecting path: top row left-to-right, drop on an outer track clear of
       every label, then bottom row right-to-left -->
  <path d="M230,260 L565,260 L900,260 L1235,260 L1570,260 L1690,260 L1690,620 L1570,620 L1235,620 L900,620 L565,620 L270,620"
        fill="none" stroke="#1971c2" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="298,603 262,620 298,637" fill="#1971c2"/>

  <!-- Step 1: Branch -->
  <g>
    <circle cx="230" cy="260" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="230" y="274" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">1</text>
    <text x="230" y="334" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#1b2230">Branch</text>
    <text x="230" y="362" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">git switch -c &lt;name&gt;</text>
  </g>

  <!-- Step 2: Check status -->
  <g>
    <circle cx="565" cy="260" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="565" y="274" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">2</text>
    <text x="565" y="334" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#1b2230">Check status</text>
    <text x="565" y="362" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">git status</text>
  </g>

  <!-- Step 3: Prompt the agent -->
  <g>
    <circle cx="900" cy="260" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="900" y="274" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">3</text>
    <text x="900" y="334" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#1b2230">Prompt the agent</text>
    <text x="900" y="362" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">goal + success criteria</text>
  </g>

  <!-- Step 4: Review the diff -->
  <g>
    <circle cx="1235" cy="260" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="1235" y="274" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">4</text>
    <text x="1235" y="334" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#1b2230">Review the diff</text>
    <text x="1235" y="362" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">git diff</text>
  </g>

  <!-- Step 5: Watch for traps -->
  <g>
    <circle cx="1570" cy="260" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="1570" y="274" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">5</text>
    <text x="1570" y="334" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#1b2230">Watch for traps</text>
    <text x="1570" y="362" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">check &amp; test it</text>
  </g>

  <!-- Step 6: Run the tests -->
  <g>
    <circle cx="1570" cy="620" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="1570" y="634" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">6</text>
    <text x="1570" y="694" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#1b2230">Run the tests</text>
    <text x="1570" y="722" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">pytest</text>
  </g>

  <!-- Step 7: Commit -->
  <g>
    <circle cx="1235" cy="620" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="1235" y="634" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">7</text>
    <text x="1235" y="694" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#1b2230">Commit</text>
    <text x="1235" y="718" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">git add &lt;file&gt;</text>
    <text x="1235" y="740" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">git commit -m "..."</text>
  </g>

  <!-- Step 8: Push -->
  <g>
    <circle cx="900" cy="620" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="900" y="634" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">8</text>
    <text x="900" y="694" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#1b2230">Push</text>
    <text x="900" y="722" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">git push -u origin &lt;name&gt;</text>
  </g>

  <!-- Step 9: Open a pull request -->
  <g>
    <circle cx="565" cy="620" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="565" y="634" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">9</text>
    <text x="565" y="694" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#1b2230">Open a pull request</text>
    <text x="565" y="722" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">gh pr create</text>
  </g>

  <!-- Step 10: Clean up after merge -->
  <g>
    <circle cx="230" cy="620" r="46" fill="#d9480f" stroke="#fffdf8" stroke-width="4"/>
    <text x="230" y="634" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#fffdf8">10</text>
    <text x="230" y="694" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#1b2230">Clean up after merge</text>
    <text x="230" y="722" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" font-size="18" fill="#5d6676">git branch -d &lt;name&gt;</text>
  </g>

  <text x="900" y="810" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-style="italic" fill="#5d6676">Each stop is small and checkable before the next one begins.</text>
</svg>
